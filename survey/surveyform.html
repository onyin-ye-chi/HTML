<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Form</title>
  </head>

  <body>
    <header>
      <h1 id="title">Survey Form</h1>
      <p id="description">
        Thank you for taking the time to help us improve the platform
      </p>
    </header>

    <main>
      <form id="survey-form">
        <label for="name" id="name-label">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          autocomplete="name"
          required
        />

        <label for="email" id="email-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        />

        <label for="number" id="number-label">Age (optional)</label>
        <input
          type="number"
          id="number"
          name="age"
          placeholder="Age"
          min="18"
          max="40"
        />

        <fieldset>
          <legend>Which option best describes your current role?</legend>
          <label for="dropdown">Current role</label>
          <select name="role" id="dropdown" required>
            <option value="" selected disabled>Select current role</option>
            <option value="student">Student</option>
            <option value="full-time-job">Full time Job</option>
            <option value="full-time-learner">Full time Learner</option>
            <option value="prefer-not-to-say">Prefer not to say</option>
            <option value="other">Other</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Would you recommend us to a friend?</legend>
          <input
            type="radio"
            id="definitely-option"
            value="definitely"
            name="choice"
            required
          />
          <label for="definitely-option">Definitely</label>

          <input type="radio" id="maybe-option" value="maybe" name="choice" />
          <label for="maybe-option">Maybe</label>

          <input type="radio" id="notsure-option" value="notsure" name="choice" />
          <label for="notsure-option">Not sure</label>
        </fieldset>

        <fieldset>
          <legend>What would you like to see improved? (Check all that apply)</legend>

          <input type="checkbox" id="projects" name="improvements" value="projects" />
          <label for="projects">Projects</label>

          <input type="checkbox" id="questions" name="improvements" value="questions" />
          <label for="questions">Questions</label>

          <input type="checkbox" id="stuff" name="improvements" value="stuff" />
          <label for="stuff">Stuff</label>
        </fieldset>

        <label for="additional-comments">Additional Comments</label>
        <textarea
          id="additional-comments"
          name="comments"
          placeholder="Enter your comments here..."
        ></textarea>

        <button type="submit" id="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
